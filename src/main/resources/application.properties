# MariaDB datasource
spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/voiture_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Data REST base path
spring.data.rest.base-path=/api

# Spring Security in-memory user
spring.security.user.name=admin
spring.security.user.password=admin123

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-spring-data-rest=false
springdoc.packages-to-scan=org.cours.web
springdoc.paths-to-match=/voitures
