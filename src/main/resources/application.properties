# MariaDB datasource
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/${DB_NAME:voiture_db}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Data REST base path
spring.data.rest.base-path=/api

# Spring Security in-memory user
spring.security.user.name=admin
spring.security.user.password=admin123

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-spring-data-rest=false
springdoc.packages-to-scan=org.cours.web
springdoc.paths-to-match=/voitures
